site_name: EHDS Integration Research
site_description: >-
  EU European Health Data Space (EHDS) Regulation research for HIS/EMR/EHR
  integration in Finland and other EU member states, including the gateway
  market opportunity and API specification status.
site_url: https://johnalexamon.github.io/EHDS/
repo_url: https://github.com/johnAlexamon/EHDS
repo_name: johnAlexamon/EHDS
edit_uri: edit/main/docs/ehds-integration/

docs_dir: docs/ehds-integration

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - search.suggest
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Legal & Technical Framework: 01-legal-and-technical-framework.md
  - Implementation Timeline: 02-implementation-timeline.md
  - Finland: 03-finland.md
  - Other Member States: 04-other-member-states.md
  - Gateway Market & API Status: 05-gateway-market-and-api-status.md
  - Recommendations: 06-recommendations.md
